spring.application.name=smartasspdf-backend
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:60MB}
management.endpoints.web.exposure.include=health,info
smartasspdf.storage-dir=${java.io.tmpdir}/smartasspdf
smartasspdf.retention-minutes=${RETENTION_MINUTES:30}
smartasspdf.cors-origin=${CORS_ORIGIN:https://serene-sherbet-b12c01.netlify.app/}


