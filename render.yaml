services:
  - type: web
    name: smartasspdf-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: CORS_ORIGIN
        value: "*"
      - key: RETENTION_MINUTES
        value: 30
      - key: MAX_FILE_SIZE
        value: 50MB
      - key: MAX_REQUEST_SIZE
        value: 60MB
